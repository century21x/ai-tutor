<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일등공신 선생님 - AI 스터디 비서</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <button id="sidebarToggleBtn" class="sidebar-toggle" aria-label="메뉴 열기">☰</button>

        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h1>🎓 일등공신</h1>
                <div class="header-tools">
                    <button id="fontSizeBtn" class="icon-btn" title="큰 글씨">A+</button>
                    <button id="themeToggleBtn" class="icon-btn" title="테마 변경">🌓</button>
                </div>
            </div>

            <div class="profile-section">
                <h3>사용자 프로필</h3>
                <div id="profileList" class="profile-list"></div>
                <button id="addProfileBtn" class="btn primary-btn">+ 새 프로필 추가</button>
            </div>

            <div class="subject-section">
                <h3>교과 선택</h3>
                <div class="subject-search-wrap">
                    <span class="subject-search-icon" aria-hidden="true">🔍</span>
                    <input type="search" id="subjectSearch" class="subject-search" placeholder="과목 검색..." autocomplete="off">
                </div>
                <div id="subjectList" class="subject-list"></div>
            </div>

            <div class="sidebar-footer">
                <button id="settingsBtn" class="btn secondary-btn">⚙️ API 설정</button>
                <button id="clearChatBtn" class="btn danger-btn">🗑️ 대화 기록 삭제</button>
            </div>
        </aside>

        <main class="chat-container">
            <header class="chat-header">
                <h2 id="currentProfileName">프로필을 선택해주세요</h2>
                <p id="currentSubjectMode">수학 문제 풀이 및 출제</p>
            </header>

            <div id="quickActions" class="quick-actions"></div>

            <div id="chatBox" class="chat-box">
                <div class="welcome-message">
                    <h3>환영합니다! 일등공신 AI 튜터입니다. 🎓</h3>
                    <p>좌측에서 프로필을 추가한 뒤 학습을 시작하세요.</p>
                </div>
            </div>

            <div class="input-area">
                <div id="quickChips" class="quick-chips"></div>
                <div id="handwritingPanel" class="handwriting-panel hidden">
                    <canvas id="handwritingCanvas" class="handwriting-canvas"></canvas>
                    <div class="handwriting-controls">
                        <span class="hw-hint">✏️ 여기에 손으로 써보세요</span>
                        <button type="button" id="hwUndoBtn" class="hw-btn" title="되돌리기">↶</button>
                        <button type="button" id="hwClearBtn" class="hw-btn">지우기</button>
                        <button type="button" id="hwCloseBtn" class="hw-btn">닫기</button>
                        <button type="button" id="hwSendBtn" class="hw-btn hw-send">전송 ➤</button>
                    </div>
                </div>
                <div class="difficulty-bar">
                    <span class="difficulty-label">난이도</span>
                    <div id="difficultySegment" class="difficulty-segment" role="group" aria-label="난이도 선택">
                        <div id="difficultySlider" class="difficulty-slider" aria-hidden="true"></div>
                        <button type="button" class="difficulty-btn" data-difficulty="쉬움"><span class="difficulty-dot easy"></span>쉬움</button>
                        <button type="button" class="difficulty-btn active" data-difficulty="보통"><span class="difficulty-dot normal"></span>보통</button>
                        <button type="button" class="difficulty-btn" data-difficulty="어려움"><span class="difficulty-dot hard"></span>어려움</button>
                    </div>
                </div>
                <div class="input-row">
                    <button type="button" id="handwritingToggleBtn" class="icon-btn input-tool-btn" title="손글씨 입력">✏️</button>
                    <button type="button" id="voiceBtn" class="icon-btn input-tool-btn" title="음성 입력">🎤</button>
                    <textarea id="userInput" placeholder="질문이나 풀고 싶은 문제를 입력하세요... (Shift+Enter 줄바꿈)"></textarea>
                    <button id="sendBtn" class="icon-btn send-btn" title="보내기">➤</button>
                </div>
            </div>
        </main>
    </div>

    <div id="profileModal" class="modal">
        <div class="modal-content">
            <h2>새 프로필 추가</h2>
            <input type="text" id="newProfileName" placeholder="이름을 입력하세요">
            <select id="newProfileGrade">
                <option value="초등학생">초등학생</option>
                <option value="중학생">중학생</option>
                <option value="고등학생">고등학생</option>
            </select>
            <div class="modal-actions">
                <button id="cancelProfileBtn" class="btn secondary-btn">취소</button>
                <button id="saveProfileBtn" class="btn primary-btn">저장</button>
            </div>
        </div>
    </div>

    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h2>설정</h2>
            <p class="help-text">Google Gemini API 키를 입력해주세요. 키는 브라우저에만 저장됩니다.</p>
            <input type="password" id="apiKeyInput" placeholder="AI API Key (Gemini)">
            <p class="help-text">
                <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>에서 무료로 발급할 수 있습니다.
            </p>
            <div class="modal-actions">
                <button id="cancelSettingsBtn" class="btn secondary-btn">취소</button>
                <button id="saveSettingsBtn" class="btn primary-btn">저장</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <script src="curriculum.js"></script>
    <script src="app.js"></script>
</body>
</html>
