<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일등공신 선생님 - AI 스터디 비서</title>
    
    <!-- KaTeX CSS for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <!-- Highlight.js for Code Formatting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">
    <div class="app-container">
        <!-- Sidebar: Profiles and Settings -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>🎓 일등공신</h1>
                <button id="themeToggleBtn" class="icon-btn" title="테마 변경">🌓</button>
            </div>

            <div class="profile-section">
                <h3>사용자 프로필</h3>
                <div id="profileList" class="profile-list">
                    <!-- Profiles will be injected here -->
                </div>
                <button id="addProfileBtn" class="btn primary-btn">+ 새 프로필 추가</button>
            </div>

            <div class="subject-section">
                <h3>현재 과목</h3>
                <div class="subject-selector active">
                    <span class="icon">📐</span> 수학
                </div>
                <!-- Other subjects will be added later -->
            </div>

            <div class="sidebar-footer">
                <button id="settingsBtn" class="btn secondary-btn">⚙️ API 설정</button>
                <button id="clearChatBtn" class="btn danger-btn">🗑️ 대화 기록 삭제</button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-container">
            <header class="chat-header">
                <h2 id="currentProfileName">프로필을 선택해주세요</h2>
                <p>수학 문제 풀이 및 출제 모드</p>
            </header>
            
            <div id="chatBox" class="chat-box">
                <!-- Chat messages will be injected here -->
                <div class="welcome-message">
                    <h3>환영합니다! 무엇을 도와드릴까요?</h3>
                    <p>수학 문제를 물어보거나, 새로운 문제를 출제해달라고 해보세요.</p>
                </div>
            </div>

            <div class="input-area">
                <textarea id="userInput" placeholder="질문이나 풀고 싶은 문제를 입력하세요... (수식 입력 가능)"></textarea>
                <button id="sendBtn" class="icon-btn send-btn" title="보내기">➤</button>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <!-- Profile Modal -->
    <div id="profileModal" class="modal">
        <div class="modal-content glass">
            <h2>새 프로필 추가</h2>
            <input type="text" id="newProfileName" placeholder="이름을 입력하세요">
            <select id="newProfileGrade">
                <option value="초등학생">초등학생</option>
                <option value="중학생">중학생</option>
                <option value="고등학생">고등학생</option>
            </select>
            <div class="modal-actions">
                <button id="cancelProfileBtn" class="btn secondary-btn">취소</button>
                <button id="saveProfileBtn" class="btn primary-btn">저장</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content glass">
            <h2>설정</h2>
            <p class="help-text">Google Gemini API 키를 입력해주세요. 키는 브라우저에만 안전하게 저장됩니다.</p>
            <input type="password" id="apiKeyInput" placeholder="AI API Key (Gemini)">
            <div class="modal-actions">
                <button id="cancelSettingsBtn" class="btn secondary-btn">취소</button>
                <button id="saveSettingsBtn" class="btn primary-btn">저장</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
